<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f6b">
  <meta name="description" content="ספר תרגול דיגיטלי בפונקציה קווית — תוכן עניינים לחיץ ודפי A4 מוכנים להדפסה">
  <title>פונקציה קווית — ספר תרגול דיגיטלי</title>
  <link rel="stylesheet" href="styles/digital-book.css">
</head>
<body>
  <div class="book-app">
    <header class="topbar">
      <button class="icon-button menu-button" id="menuButton" type="button" aria-label="פתיחת תוכן העניינים" aria-expanded="false">☰</button>
      <div class="brand">
        <div class="brand-kicker">ספר תרגול דיגיטלי</div>
        <h1>פונקציה קווית</h1>
      </div>
      <div class="topbar-status" id="bookStatus" aria-live="polite">טוען את הספר…</div>
    </header>

    <div class="book-layout">
      <aside class="toc" id="toc" aria-label="תוכן עניינים">
        <div class="toc-head">
          <div>
            <div class="eyebrow">ניווט מהיר</div>
            <h2>תוכן עניינים</h2>
          </div>
          <button class="icon-button close-toc" id="closeToc" type="button" aria-label="סגירת תוכן העניינים">×</button>
        </div>
        <label class="search-box">
          <span class="sr-only">חיפוש בדפי הספר</span>
          <input id="tocSearch" type="search" placeholder="חיפוש לפי נושא או עמוד…" autocomplete="off">
        </label>
        <nav id="tocList" class="toc-list" aria-label="פרקים ודפים"></nav>
      </aside>
      <div class="toc-scrim" id="tocScrim" hidden></div>

      <main class="reader" id="reader">
        <section class="reader-bar" aria-label="כלי ניווט בספר">
          <button class="nav-button" id="prevPage" type="button">העמוד הקודם</button>
          <div class="page-position">
            <strong id="currentPageTitle">טוען…</strong>
            <span id="currentPageMeta"></span>
          </div>
          <button class="nav-button primary" id="nextPage" type="button">העמוד הבא</button>
          <div class="reader-actions">
            <button class="action-button" id="printPage" type="button">הדפסה</button>
            <a class="action-button" id="openPage" href="עמוד-1.html" target="_blank" rel="noopener">פתיחה מלאה</a>
          </div>
        </section>

        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>

        <section class="page-stage" id="pageStage" aria-label="עמוד הספר">
          <div class="loading-card" id="loadingCard">טוען את העמוד…</div>
          <iframe id="pageFrame" title="עמוד מתוך ספר פונקציה קווית" loading="eager"></iframe>
        </section>
      </main>
    </div>
  </div>

  <script src="scripts/digital-book.js" defer></script>
</body>
</html>
