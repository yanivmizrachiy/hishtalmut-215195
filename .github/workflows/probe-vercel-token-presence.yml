name: Probe Vercel token presence

on:
  push:
    branches:
      - probe/vercel-token-presence-20260910

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN_PRESENT=true"
          else
            echo "VERCEL_TOKEN_PRESENT=false"
            exit 2
          fi
