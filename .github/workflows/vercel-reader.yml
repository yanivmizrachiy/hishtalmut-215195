name: Deploy public reader to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'reader/**'
      - '.github/workflows/vercel-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linear-function-vercel-reader
  cancel-in-progress: true

jobs:
  deploy-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_lvylZaui6gt5QxzzssXTIKma
      VERCEL_PROJECT_ID: prj_6ywVoEYEUFFpVV7gp7TcQqZl5HNq
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is missing. Add the repository Actions secret VERCEL_TOKEN and re-run this workflow."
            exit 1
          fi
          echo "VERCEL_TOKEN is available."

      - name: Deploy current reader to production
        working-directory: reader
        run: npx --yes vercel@59.3.0 deploy --prod --force --yes --token="$VERCEL_TOKEN"

      - name: Verify production serves the current reader
        shell: bash
        run: |
          for attempt in {1..12}; do
            BODY="$(curl -fsSL --max-time 20 "https://linear-function-digital-book.vercel.app/?verify=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq "https://yanivmizrachiy.github.io/hishtalmut-215195/" <<<"$BODY"; then
              echo "Production reader verified."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production alias did not serve the current reader after deployment."
          exit 1
