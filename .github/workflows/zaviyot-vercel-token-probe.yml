name: Zaviyot Vercel token probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zaviyot-vercel-token-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify token availability without exposing it
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is unavailable to this repository"
            exit 1
          fi
          echo "VERCEL_TOKEN is available for a temporary exact-project relay"
