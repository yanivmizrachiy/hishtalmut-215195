name: Workbook CI & Pages

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# The repo tracks only source (content, scripts, styles/a4-base.css, styles/layout-contract.css,
# sources/). All rendered HTML and KaTeX assets are generated by `npm run build` and published to
# GitHub Pages by the deploy job below — they are never committed back to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workbook-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deterministic quality gate: build + structural / exact-math / architecture validation.
  # This is what gates deployment — it renders identically on every machine.
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build + structural / math / architecture QA
        run: npm run qa

  # Cross-platform visual evidence (A4 overflow, mobile/print parity). Rendering metrics differ by
  # a few px between OSes, so this job is informational and does NOT gate deployment; the authored
  # overflow gate is the local visual-qa run performed before each push.
  visual-qa:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.1-chromium
      - name: Install dependencies and Chromium
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
      - name: Build + visual QA
        shell: bash
        env:
          QA_CONCURRENCY: 4
        run: |
          set -o pipefail
          npm run build
          npm run qa:visual 2>&1 | tee qa-run.log
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbook-visual-qa
          path: |
            qa/
            qa-run.log
            meta/visual-qa-latest.json
          if-no-files-found: ignore
          retention-days: 14

  # Build the site from source and publish it to GitHub Pages. No generated file is ever committed.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build workbook (renders pages, KaTeX assets and catalog)
        run: npm run build
      - name: Stage published site
        shell: bash
        run: |
          rm -rf _site && mkdir _site
          cp index.html _site/
          cp עמוד-*.html _site/
          cp -r styles _site/styles
          echo "Staged $(ls _site/עמוד-*.html | wc -l) pages + catalog + styles."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
