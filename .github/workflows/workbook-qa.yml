name: Workbook CI & Pages

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pure-source repository: rendered pages and PWA shell are generated during build/deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workbook-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build + structural / math / architecture / unification QA
        run: npm run qa
      - name: Audit all 141 pinned razpages linear source pages
        run: npm run audit:razpages
      - name: Upload source coverage and provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbook-source-audit
          path: |
            meta/razpages-source-audit-latest.json
            meta/source-coverage-latest.json
            meta/provenance-latest.json
          if-no-files-found: ignore
          retention-days: 30

  visual-qa:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.1-chromium
      - name: Install dependencies and Chromium
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
      - name: Build + visual QA
        shell: bash
        env:
          QA_CONCURRENCY: 4
        run: |
          set -o pipefail
          npm run build
          npm run qa:visual 2>&1 | tee qa-run.log
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbook-visual-qa
          path: |
            qa/
            qa-run.log
            meta/visual-qa-latest.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [qa, visual-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build workbook and canonical reader
        run: npm run build
      - name: Stage published site
        shell: bash
        run: |
          rm -rf _site && mkdir _site
          cp index.html _site/
          cp עמוד-*.html _site/
          cp manifest.webmanifest sw.js app-icon.svg _site/
          cp -r styles _site/styles
          cp -r reader _site/reader
          echo "Staged $(ls _site/עמוד-*.html | wc -l) pages + canonical reader + PWA assets + styles."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
