name: Workbook QA

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workbook-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-agent-build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build and structural/math regression QA
        run: npm run qa

      - name: Persist generated state on agent branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- SOURCE_OF_TRUTH.md content scripts styles/a4-base.css
          git add -- meta/pages.json
          git add -- 'עמוד-'*.html styles/katex.min.css styles/fonts
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Persist generated workbook state"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  full-visual-qa:
    if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.1-chromium

      - name: Install workbook dependencies and Chromium
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Full workbook QA
        shell: bash
        env:
          QA_CONCURRENCY: 4
        run: |
          set -o pipefail
          npm run qa:all 2>&1 | tee qa-run.log

      - name: Persist fully verified state on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- SOURCE_OF_TRUTH.md content scripts styles/a4-base.css
          git add -- meta/pages.json meta/visual-qa-latest.json
          git add -- 'עמוד-'*.html styles/katex.min.css styles/fonts
          if git diff --cached --quiet; then
            echo "Verified state already synchronized."
          else
            git commit -m "Persist fully verified workbook state"
            git push origin HEAD:main
          fi

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbook-qa
          path: |
            qa/
            qa-run.log
            meta/visual-qa-latest.json
          if-no-files-found: ignore
          retention-days: 14
