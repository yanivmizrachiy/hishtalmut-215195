<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f6b">
<meta name="description" content="ספר תרגול דיגיטלי בפונקציה קווית — 76 דפי עבודה">
<title>פונקציה קווית — ספר תרגול דיגיטלי</title>
<style>
:root{--ink:#17324f;--muted:#66788a;--line:#d9e2ec;--bg:#f4f7fb;--nav:#173f6b;--nav2:#245b8f;--accent:#d99b3d;font-family:Arial,"Noto Sans Hebrew",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{overflow-x:hidden;overflow-y:auto;touch-action:pan-y}button,input{font:inherit}button,a{touch-action:manipulation}a{color:inherit;text-decoration:none}.topbar{height:74px;background:linear-gradient(110deg,var(--nav),#102f50);color:#fff;display:flex;align-items:center;gap:14px;padding:0 20px;box-shadow:0 4px 18px #0e29452b;position:sticky;top:0;z-index:40}.brand h1{font-size:1.42rem;margin:0}.brand small{display:block;opacity:.78;margin-bottom:2px}.status{margin-inline-start:auto;background:#ffffff1c;border:1px solid #ffffff2e;border-radius:999px;padding:7px 11px;font-size:.82rem;white-space:nowrap}.icon{border:0;background:transparent;color:inherit;width:42px;height:42px;border-radius:10px;font-size:1.45rem;cursor:pointer;display:grid;place-items:center}.menu{display:none}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);align-items:start}.toc{background:#fff;border-left:1px solid var(--line);height:calc(100vh - 74px);position:sticky;top:74px;display:flex;flex-direction:column;z-index:30}.toc-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px}.toc-head h2{margin:0;font-size:1.12rem}.close{display:none;color:var(--ink)}.search{padding:0 14px 12px}.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#f8fafc}.toc-list{overflow:auto;padding:0 8px 20px}.chapter{border-top:1px solid #edf1f5}.chapter summary{cursor:pointer;padding:11px 8px;font-weight:700;color:#29455f}.pages{display:grid;gap:3px;padding:0 4px 10px}.page-btn{border:0;background:transparent;text-align:right;border-radius:9px;padding:8px 9px;cursor:pointer;color:#496276;display:grid;grid-template-columns:32px 1fr;gap:7px}.page-btn.active{background:#e9f1f8;color:#123f66;font-weight:700;box-shadow:inset -3px 0 0 var(--nav2)}.reader{min-width:0;overflow:visible}.tools{position:sticky;top:74px;z-index:20;background:#f4f7fbf2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(160px,1fr) auto auto;align-items:center;gap:8px;padding:9px 14px}.btn,.link{border:1px solid #cbd8e4;background:#fff;color:#23435f;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;white-space:nowrap;text-align:center}.btn.primary{background:var(--nav);border-color:var(--nav);color:#fff}.btn:disabled{opacity:.4}.position{text-align:center;min-width:0}.position strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.position span{font-size:.78rem;color:var(--muted)}.actions{display:flex;gap:6px}.progress{height:3px;background:#e3eaf1;position:sticky;top:133px;z-index:19}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),#efc36f)}.stage{padding:20px 10px 40px;display:flex;flex-direction:column;align-items:center;gap:22px;overflow:visible;touch-action:pan-y}.page-wrap{width:100%;display:flex;justify-content:center;scroll-margin-top:150px;touch-action:pan-y}.frame-shell{position:relative;overflow:hidden;background:#fff;box-shadow:0 12px 36px #19304524;flex:none;touch-action:pan-y}.frame-shell iframe{position:absolute;top:0;left:0;width:794px;height:1123px;border:0;transform-origin:top left;background:#fff;pointer-events:none}.scrim{display:none}.error{margin:50px auto;padding:20px;max-width:560px;background:#fff;border:1px solid #e0bcbc;border-radius:12px;color:#7a3131}@media(max-width:980px){.topbar{height:68px;padding:0 12px}.layout{display:block}.menu{display:grid}.toc{position:fixed;right:0;top:0;height:100vh;width:min(88vw,350px);transform:translateX(105%);transition:.2s;box-shadow:-16px 0 45px #122d4533}.toc.open{transform:translateX(0)}.close{display:grid}.scrim{display:block;position:fixed;inset:0;background:#0b1f316b;z-index:25}.tools{top:68px;grid-template-columns:1fr 1fr;padding:8px}.position{grid-column:1/-1;grid-row:1}.actions{grid-column:1/-1;justify-content:center}.progress{top:201px}.stage{padding:12px 0 30px;gap:14px}.page-wrap{scroll-margin-top:215px}}@media(max-width:540px){.brand small{display:none}.brand h1{font-size:1.18rem}.status{font-size:.73rem;padding:6px 8px;max-width:43vw;overflow:hidden;text-overflow:ellipsis}.btn,.link{padding:8px;font-size:.88rem}.actions>*{flex:1}.position strong{font-size:.9rem}}
</style>
</head>
<body>
<header class="topbar"><button class="icon menu" id="menu" aria-label="פתיחת תוכן העניינים">☰</button><div class="brand"><small>ספר תרגול דיגיטלי</small><h1>פונקציה קווית</h1></div><div class="status" id="status">טוען…</div></header>
<div class="layout">
<aside class="toc" id="toc"><div class="toc-head"><h2>תוכן עניינים</h2><button class="icon close" id="close" aria-label="סגירה">×</button></div><label class="search"><input id="search" type="search" placeholder="חיפוש לפי נושא או עמוד…"></label><nav class="toc-list" id="tocList"></nav></aside>
<div class="scrim" id="scrim" hidden></div>
<main class="reader" id="reader">
<section class="tools"><button class="btn" id="prev">העמוד הקודם</button><div class="position"><strong id="title">טוען…</strong><span id="meta"></span></div><button class="btn primary" id="next">העמוד הבא</button><div class="actions"><a class="link" id="print" target="_blank" rel="noopener">הדפסה / פתיחה מלאה</a></div></section>
<div class="progress"><div id="bar"></div></div>
<section class="stage" id="stage"></section>
</main></div>
<script>
const RAW='https://raw.githubusercontent.com/yanivmizrachiy/hishtalmut-215195/main/';
const PAGES='https://yanivmizrachiy.github.io/hishtalmut-215195/';
const W=794,H=1123;
const TOPIC_HEADINGS={1:'ייצוגים של פונקציה קווית',2:'אפיון של פונקציה קווית',3:'אפיון של פונקציה קווית',7:'משמעות הפרמטרים'};
const $=id=>document.getElementById(id);let pages=[],current=1,observer;
function urlFor(n){return PAGES+'עמוד-'+n+'.html'}
function fitAll(){const stage=$('stage');const available=Math.max(280,stage.clientWidth-20);const scale=Math.min(1,available/W);document.querySelectorAll('.frame-shell').forEach(shell=>{shell.style.width=Math.round(W*scale)+'px';shell.style.height=Math.round(H*scale)+'px';const frame=shell.querySelector('iframe');frame.style.transform='scale('+scale+')'})}
function drawer(open){$('toc').classList.toggle('open',open);$('scrim').hidden=!open}
function hashPage(){const m=location.hash.match(/page=(\d+)/);return m?Number(m[1]):null}
function renderToc(){const groups=new Map();for(const p of pages){if(!groups.has(p.chapter))groups.set(p.chapter,[]);groups.get(p.chapter).push(p)}$('tocList').innerHTML='';for(const [chapter,list] of groups){const d=document.createElement('details');d.className='chapter';const s=document.createElement('summary');const topic=TOPIC_HEADINGS[chapter];s.textContent=(topic||('פרק '+chapter))+' · '+list.length+' דפים';const box=document.createElement('div');box.className='pages';for(const p of list){const b=document.createElement('button');b.className='page-btn';b.dataset.page=p.page;b.dataset.search=((p.title||'')+' '+(topic||'')+' '+p.page).toLowerCase();b.innerHTML='<span>'+p.page+'</span><span>'+(p.title||('עמוד '+p.page))+'</span>';b.onclick=()=>{goToPage(p.page);drawer(false)};box.appendChild(b)}d.append(s,box);$('tocList').appendChild(d)}}
function renderPages(){const stage=$('stage');stage.innerHTML='';for(const p of pages){const wrap=document.createElement('div');wrap.className='page-wrap';wrap.id='page-'+p.page;wrap.dataset.page=p.page;const shell=document.createElement('div');shell.className='frame-shell';const frame=document.createElement('iframe');frame.title=(p.title||('עמוד '+p.page))+' — פונקציה קווית';frame.loading=p.page<=2?'eager':'lazy';frame.src=urlFor(p.page);shell.appendChild(frame);wrap.appendChild(shell);stage.appendChild(wrap)}fitAll();observer=new IntersectionObserver(entries=>{let best=null;for(const e of entries){if(!e.isIntersecting)continue;if(!best||e.intersectionRatio>best.intersectionRatio)best=e}if(best)updateCurrent(Number(best.target.dataset.page),true)},{root:null,rootMargin:'-210px 0px -45% 0px',threshold:[.05,.2,.4,.6]});document.querySelectorAll('.page-wrap').forEach(el=>observer.observe(el))}
function active(){document.querySelectorAll('.page-btn').forEach(b=>{const on=Number(b.dataset.page)===current;b.classList.toggle('active',on);if(on){const d=b.closest('details');if(d)d.open=true}})}
function updateCurrent(n,replace=true){if(!pages.length)return;current=Math.max(1,Math.min(pages.length,Number(n)||1));const p=pages.find(x=>x.page===current)||pages[current-1];$('title').textContent=p.title||('עמוד '+current);const topic=TOPIC_HEADINGS[p.chapter];$('meta').textContent=(topic||('פרק '+p.chapter))+' · עמוד '+current+' מתוך '+pages.length;$('prev').disabled=current<=1;$('next').disabled=current>=pages.length;$('bar').style.width=(current/pages.length*100)+'%';$('print').href=urlFor(current);active();const h='#page='+current;if(location.hash!==h){replace?history.replaceState(null,'',h):history.pushState(null,'',h)}localStorage.setItem('linear-book-last-page',String(current))}
function goToPage(n,replace=false){if(!pages.length)return;const page=Math.max(1,Math.min(pages.length,Number(n)||1));updateCurrent(page,replace);document.getElementById('page-'+page)?.scrollIntoView({behavior:'smooth',block:'start'})}
$('prev').onclick=()=>goToPage(current-1);$('next').onclick=()=>goToPage(current+1);$('menu').onclick=()=>drawer(true);$('close').onclick=()=>drawer(false);$('scrim').onclick=()=>drawer(false);$('search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.chapter').forEach(d=>{let v=0;d.querySelectorAll('.page-btn').forEach(b=>{const show=!q||b.dataset.search.includes(q);b.hidden=!show;if(show)v++});d.hidden=v===0;if(q&&v)d.open=true})};window.addEventListener('resize',fitAll);window.addEventListener('hashchange',()=>{const n=hashPage();if(n&&n!==current)goToPage(n,true)});
(async()=>{try{const r=await fetch(RAW+'meta/pages.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('manifest '+r.status);const m=await r.json();pages=(m.pages||[]).slice().sort((a,b)=>a.page-b.page);$('status').textContent=pages.length+' עמודים · '+(m.verifiedPages||0)+' מאומתים';renderToc();renderPages();const start=hashPage()||Number(localStorage.getItem('linear-book-last-page'))||1;requestAnimationFrame(()=>goToPage(start,true))}catch(e){$('status').textContent='שגיאת טעינה';document.querySelector('.reader').innerHTML='<div class="error"><strong>לא ניתן לטעון את תוכן הספר.</strong><br>נסו לרענן את העמוד.</div>';console.error(e)}})();
</script>
</body>
</html>
